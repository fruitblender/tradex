services:
  node1:
    build:
      context: ../
      dockerfile: exp04-election-algorithms/Dockerfile
    container_name: bully-node1
    command: ["java", "tradex.election.bully.BullyNode"]
    environment:
      - NODE_ID=1
      - NODE_PORT=8001
      - PEERS=1:node1:8001,2:node2:8002,3:node3:8003
    networks:
      - tradex-bully

  node2:
    build:
      context: ../
      dockerfile: exp04-election-algorithms/Dockerfile
    container_name: bully-node2
    command: ["java", "tradex.election.bully.BullyNode"]
    environment:
      - NODE_ID=2
      - NODE_PORT=8002
      - PEERS=1:node1:8001,2:node2:8002,3:node3:8003
    networks:
      - tradex-bully

  node3:
    build:
      context: ../
      dockerfile: exp04-election-algorithms/Dockerfile
    container_name: bully-node3
    command: ["java", "tradex.election.bully.BullyNode"]
    environment:
      - NODE_ID=3
      - NODE_PORT=8003
      - PEERS=1:node1:8001,2:node2:8002,3:node3:8003
    networks:
      - tradex-bully

networks:
  tradex-bully:
    driver: bridge
